</style></head><body><div id="w"><canvas id="c" width="270" height="480"></canvas>

<script>
const $=i=>document.getElementById(i),C=$('c');let X=C.getContext('2d');const W=270,H=480,HZ=130,GY=410,LW=62;
let S={};try{S=JSON.parse(localStorage.getItem('sp5')||'{}')}catch(e){}
S.coins=S.coins||0;S.gems=S.gems==null?5:S.gems;S.bu=S.bu==null?3:S.bu;S.best=S.best||0;S.ownS=S.ownS||['omar'];S.ownB=S.ownB||['basic'];S.skin=S.skin||'omar';S.board=S.board||'basic';S.ms=S.ms||[];
const save=()=>{try{localStorage.setItem('sp5',JSON.stringify(S))}catch(e){}};
// [name,price,[shirt,pants,skin,hair,pack],hat,pose]
const SK={omar:['عمر',0,['#2f6fe0','#3b3f66','#f0b98a','#e63946','#ffd23f'],'cap',0],layan:['ليان',3000,['#2f9f6b','#3b3f66','#f0b98a','#f4a8c0','#8a4fff'],'hijab',1],bedu:['البدوي',6000,['#f4f1e8','#e8e2d0','#d9a577','#d22','#8a5a2b'],'ghutra',2],ninja:['النينجا',9000,['#2a2a2a','#151515','#e0b090','#d11','#555'],'band',3],fares:['الفارس',15000,['#2f7a4a','#3a2f25','#c98f63','#222','#7a5a3a'],'shem',4],robot:['الروبوت',25000,['#9aa7b5','#5b6775','#c7d1db','#00e0ff','#ff5d5d'],'ant',1],mami:['مامي ميوثة',35000,['#1c1c28','#f4f4f4','#f6c9a8','#ff9ec7','#fdfdfd'],'catmaid',3],king:['الملك',50000,['#ffd23f','#c98a00','#f0b98a','#ffe066','#a06a00'],'crown',0]};
// [name,price,color,duration,magnet,double,desc]
const BD={basic:['الكلاسيكي',0,'#4cc9f0',8,0,0,'درع 8 ث'],flag:['علم الثورة',5000,'#1f9d55',10,0,0,'درع 10 ث'],flame:['اللهب',9000,'#ff7b00',12,1,0,'درع 12 ث + مغناطيس'],ice:['الجليد',14000,'#a0e8ff',12,0,1,'درع 12 ث + عملات ×2'],gold:['الملكي',30000,'#ffd23f',15,1,1,'درع 15 ث + مغناطيس + ×2']};
const PD={mag:['M','#e33',10,'مغناطيس'],jet:['J','#fa0',6,'جيتباك!'],sn:['S','#3c3',12,'قفزة خارقة'],x2:['×2','#38f',15,'×2 نقاط']};
const MT={coin:['اجمع {n} عملة',[60,100,150],[50,80,120]],jump:['اقفز {n} مرة',[15,25,40],[50,80,120]],roll:['انزلق {n} مرات',[10,15,25],[50,80,120]],pw:['التقط {n} قدرات',[2,3,4],[60,90,130]],hb:['شغّل لوح التزلج {n} مرات',[1,2,3],[60,90,130]],run:['العب {n} جولات',[2,3,4],[40,70,100]],
 hscore:['حقق {n} نقطة في جولة واحدة',[3000,5000],[2,3]],hcoin:['اجمع {n} عملة في جولة واحدة',[150,250],[2,3]],hpw:['التقط {n} قدرات في جولة واحدة',[5,7],[2,3]]};
function newM(){const hard=Math.random()<.22&&!S.ms.some(m=>m.g),ks=Object.keys(MT).filter(k=>(k[0]=='h'&&k!='hb')==hard&&!S.ms.some(m=>m.t==k));
 const k=ks[Math.random()*ks.length|0]||'run',T=MT[k],i=Math.random()*T[1].length|0;return{t:k,n:T[1][i],p:0,d:0,r:T[2][i],g:hard}}
while(S.ms.length<3)S.ms.push(newM());
function tst(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(tst.h);tst.h=setTimeout(()=>e.style.display='none',2200)}
function mchk(m){if(!m.d&&m.p>=m.n){m.p=m.n;m.d=1;tst('✅ مهمة مكتملة! افتح المهمات');fan([523,659,784,1046]);save()}}
function mp(t,n){for(const m of S.ms)if(m.t==t&&!m.d){m.p+=n;mchk(m)}}
function mset(t,v){for(const m of S.ms)if(m.t==t&&!m.d){m.p=Math.max(m.p,v|0);mchk(m)}}
// audio
let AC,NB,mute=false;
function ia(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}AC.resume()}
function snd(f,d,t='square',v=.07,e=0,dl=0){if(mute||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,n);if(e)o.frequency.exponentialRampToValueAtTime(e,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}
function nz(d,v=.08,fq=2000){if(mute||!AC)return;const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter(),n=AC.currentTime;s.buffer=NB;f.type=fq>5000?'highpass':'lowpass';f.frequency.value=fq;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(n);s.stop(n+d)}
const fan=a=>a.forEach((f,i)=>snd(f,.16,'square',.07,0,i*.09));
// Hijaz scale + darbuka rhythm
const HJ=[293.66,311.13,369.99,392,440,466.16,523.25,587.33],ML=[0,-1,2,-1,3,2,1,-1,0,-1,1,2,3,4,3,-1],BS=[73.4,0,0,0,110,0,0,0,73.4,0,73.4,0,110,0,98,0];let ms=0;
setInterval(()=>{if(state=='play'||state=='intro'){const i=ms++%16;if(BS[i])snd(BS[i],.2,'triangle',.12);if(ML[i]>=0)snd(HJ[ML[i]],.14,'triangle',.05);if(i%8==4&&ML[i]>=0)snd(HJ[ML[i]]*2,.1,'square',.015);
 if([0,8,10].includes(i))snd(100,.14,'sine',.16,45);if([4,12,6,14].includes(i))nz(.05,.07,6000);if(i==2||i==13)nz(.03,.04,3500)}},130);
// state
let G,state='menu',tab='s';
function reset(){G={z:0,x:0,tl:1,h:0,vy:0,roll:0,sp:22,t:0,score:0,coins:0,ob:[],nx:20,pw:{mag:0,jet:0,sn:0,x2:0},hb:0,hbCd:0,inv:0,dead:0,shake:0,fx:[],ft:[],pwc:0,rv:0,cb:0,ct:0,ht:0,fl:0,sq:0,it:0,chase:0,cd:0,da:0}}
reset();
const VH=[{h:60,len:8,w:27,c:'#f2f2f2',a:'#1f9d55'},{h:38,len:5,w:25,c:'#3a6fd8',a:'#fff',melon:1},{h:30,len:4,w:24,c:'#ffd23f',a:'#111',taxi:1},{h:48,len:6,w:26,c:'#e8e8e8',a:'#d52b2b'}];
const ob=(l,k,z,len,e)=>G.ob.push(Object.assign({l,k,z,len:len||1},e));
function seg(){const z=80,f=Math.random()*3|0,jet=G.pw.jet>0;let tr=0;
 for(let l=0;l<3;l++)if(l!=f&&Math.random()<.75){const r=Math.random();if(r<.45){const i=Math.random()*4|0;ob(l,'V',z,VH[i].len,{c:i});tr=1}else if(r<.72)ob(l,'L',z);else ob(l,'H',z)}
 if(tr&&Math.random()<.5)setTimeout(()=>{if(state=='play'){snd(300,.25,'sawtooth',.05,260);snd(380,.25,'sawtooth',.04,330)}},500);
 const arc=Math.random()<.4,n=6;
 for(const l of jet?[0,1,2]:[f])for(let i=0;i<n;i++)ob(l,'c',z+i*3,0,{h:jet?70:arc?10+Math.sin(i/(n-1)*Math.PI)*40:10});
 const r=Math.random();if(r<.09)ob(f,'p',z+20,0,{h:20,p:['mag','jet','sn','x2'][Math.random()*4|0]});else if(r<.12)ob(f,'g',z+20,0,{h:20});
 G.nx=24+Math.random()*8}
const fx=(x,y,c,n,s)=>{for(let i=0;i<n;i++)G.fx.push({x,y,vx:(Math.random()-.5)*s,vy:(Math.random()-.8)*s,l:.4+Math.random()*.4,c})};
const ft=(x,y,t,c)=>G.ft.push({x,y,t,c,l:1});
function crash(o){const g=G,px=W/2+g.x*LW;
 if(g.hb>0){g.hb=0;g.hbCd=6;g.inv=1.5;g.shake=1;o.dead=1;nz(.4,.2,1500);snd(150,.4,'sawtooth',.15,40);fx(px,GY-g.h-10,BD[S.board][2],30,140);ft(px,GY-60,'تحطّم اللوح!',BD[S.board][2])}
 else{g.dead=1;g.da=0;g.shake=1.2;nz(.6,.25,900);snd(200,.7,'sawtooth',.18,30);snd(100,.5,'sine',.2,30);fx(px,GY-g.h-15,'#fff',30,160);fx(px,GY-g.h-15,'#ffd23f',20,120);
  state='rv';g.rvt=7;const c=3*(1<<g.rv);g.cost=c;$('rvg').textContent='💎 أكمل ('+c+')';$('rvg').disabled=S.gems<c;show('rv',1);$('hbb').style.display=$('pz').style.display='none';setTimeout(()=>{if(state=='rv')snd(300,.5,'sawtooth',.08,120)},700)}}
function upd(dt){const g=G;g.t+=dt;g.sp=Math.min(22+g.t*.35,46);const v=g.sp*dt;g.z+=v;g.score+=v*(g.pw.x2>0?2:1)*.6;
 if(g.chase>0)g.chase-=dt;else g.cd+=dt;
 for(const k in g.pw)if(g.pw[k]>0){g.pw[k]-=dt;if(k=='jet'&&g.pw[k]<=0)g.inv=1.2}
 if(g.hb>0){g.hb-=dt;if(g.hb<=0)g.hbCd=6;if((g.ht-=dt)<=0){g.ht=.25;snd(220+Math.random()*30,.2,'sine',.03)}}else if(g.hbCd>0)g.hbCd-=dt;
 g.inv-=dt;g.roll-=dt;g.sq-=dt;if((g.ct-=dt)<=0)g.cb=0;g.x+=(g.tl-1-g.x)*Math.min(1,dt*14);
 const jet=g.pw.jet>0,px=W/2+g.x*LW;
 if(jet){g.h+=(70-g.h)*Math.min(1,dt*4);g.vy=0;fx(px,GY-g.h-8,Math.random()<.5?'#ff8a00':'#ffe066',1,60);if((g.fl-=dt)<=0){g.fl=.09;snd(70+Math.random()*40,.1,'sawtooth',.04);nz(.08,.03,3000)}}
 else{const pv=g.vy;g.vy-=620*dt;g.h+=g.vy*dt;if(g.h<=0){g.h=0;g.vy=0;if(pv<-150){snd(90,.12,'sine',.12,50);fx(px,GY,'#999',6,60);g.sq=.12}else if(Math.random()<.3)fx(px,GY,'#888',1,40)}}
 g.nx-=v;if(g.nx<=0)seg();
 const bd=BD[S.board],mag=g.pw.mag>0||(g.hb>0&&bd[4]),dbl=(g.pw.x2>0?2:1)*(g.hb>0&&bd[5]?2:1);
 const y0=g.h,y1=g.h+(g.roll>0&&g.h<1?18:38),pl=g.x+1;
 for(const o of g.ob){o.z-=v;if(o.dead)continue;
  if(o.k=='c'||o.k=='p'||o.k=='g'){
   if(mag&&o.k=='c'&&o.z<28&&o.z>-2)o.l+=(pl-o.l)*Math.min(1,dt*10);
   if(Math.abs(o.l-pl)<.55&&o.z<1.5&&o.z>-1.5&&o.h>y0-14&&o.h<y1+6){o.dead=1;const ox=W/2+(o.l-1)*LW;
    if(o.k=='c'){g.coins+=dbl;g.cb++;g.ct=.6;snd(880+Math.min(g.cb,10)*60,.08,'square',.06);snd(1320+Math.min(g.cb,10)*60,.06,'triangle',.04,0,.04);mp('coin',1);fx(ox,GY-o.h,'#ffd23f',5,70)}
    else if(o.k=='g'){S.gems++;fan([784,988,1175,1568]);ft(ox,GY-50,'+1 💎','#7df');fx(ox,GY-o.h,'#7df',16,100);save()}
    else{g.pw[o.p]=PD[o.p][2];g.pwc++;mp('pw',1);fan(o.p=='jet'?[392,523,659,784,1046]:[500,700,900,1200]);ft(px,GY-g.h-50,PD[o.p][3],PD[o.p][1]);fx(px,GY-g.h-20,PD[o.p][1],18,100)}}
  }else if(!jet&&g.inv<=0&&Math.abs(o.l-pl)<.6&&o.z<1&&o.z+o.len>-1){
   const r=o.k=='V'?[0,VH[o.c].h]:o.k=='L'?[0,16]:[24,50];if(y0<r[1]&&y1>r[0])crash(o)}}
 g.ob=g.ob.filter(o=>!o.dead&&o.z+o.len>-6)}
function fxu(dt){G.shake-=dt*2;for(const p of G.fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt}G.fx=G.fx.filter(p=>p.l>0);for(const f of G.ft){f.y-=25*dt;f.l-=dt}G.ft=G.ft.filter(f=>f.l>0)}
// controls
function lane(d){if(state!='play')return;const n=Math.max(0,Math.min(2,G.tl+d));if(n!=G.tl){G.tl=n;nz(.08,.05,3000);snd(300,.08,'triangle',.07,500)}}
function jump(){if(state!='play'||G.pw.jet>0)return;if(G.h<=.5){G.vy=G.pw.sn>0?330:240;G.roll=0;mp('jump',1);snd(350,.2,'square',.07,900);if(G.pw.sn>0)snd(700,.25,'sine',.05,1400)}}
function roll(){if(state!='play')return;if(G.h<=.5){G.roll=.6;mp('roll',1);nz(.2,.08,2000);snd(250,.2,'sawtooth',.05,100)}else{G.vy=-520;snd(500,.12,'square',.05,150)}}
function board(){if(state!='play'||G.hb>0||G.hbCd>0)return;if(S.bu<1){tst('انتهت استخدامات اللوح — اشترِ المزيد من المتجر');return}S.bu--;save();G.hb=BD[S.board][3];mp('hb',1);snd(300,.4,'sine',.1,1200);nz(.3,.07,4000);fx(W/2+G.x*LW,GY-G.h,BD[S.board][2],24,110);ft(W/2+G.x*LW,GY-70,'🛹 '+BD[S.board][0],BD[S.board][2])}
function pause(){if(state=='play'){state='pause';show('paus',1)}else if(state=='pause'){state='play';show('paus',0)}}
const KM={ArrowLeft:()=>lane(-1),KeyA:()=>lane(-1),ArrowRight:()=>lane(1),KeyD:()=>lane(1),ArrowUp:jump,KeyW:jump,Space:jump,ArrowDown:roll,KeyS:roll,KeyH:board,KeyE:board,KeyP:pause,Escape:pause};
addEventListener('keydown',e=>{ia();if(state=='intro'){G.it=2.7;e.preventDefault();return}const f=KM[e.code];if(f){f();e.preventDefault()}});
let tx,ty;$('w').addEventListener('pointerdown',e=>{ia();tx=e.clientX;ty=e.clientY});
$('w').addEventListener('pointerup',e=>{if(tx==null)return;if(state=='intro'){G.it=Math.max(G.it,2.7);tx=null;return}if(state!='play')return;const dx=e.clientX-tx,dy=e.clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))>25){if(Math.abs(dx)>Math.abs(dy))lane(dx>0?1:-1);else dy<0?jump():roll()}tx=null});
// screens
const show=(id,v)=>$(id).style.display=v?'flex':'none';
